/* VOICE: cockpit instrument glass — calm, legible, cold light with warm loot colours

:root{--bg:#03050a;--ink:#dceeff;--mut:#7f95b0;--acc:#4dd6ff;--gold:#ffd34d;--red:#ff5a5a;--grn:#5be37d;--glass:rgba(8,14,26,.86);--line:rgba(120,200,255,.18)}

#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:var(--ink);background:rgba(77,214,255,.08);border:1px solid rgba(77,214,255,.35);padding:7px 12px;border-radius:6px;cursor:pointer;pointer-events:auto;min-height:34px;transition:background .12s}
button:hover:not(:disabled){background:rgba(77,214,255,.22)}button:disabled{opacity:.38;cursor:default}
button.primary{background:var(--acc);color:#02101a;font-weight:700;border-color:var(--acc)}button.danger{border-color:rgba(255,90,90,.5);color:#ffb0b0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
small{color:var(--mut);font-weight:400}.muted{color:var(--mut)}.small{font-size:13px}.gold{color:var(--gold)}.up{color:var(--grn)}.down{color:var(--red)}.pad{padding:8px 2px}
h3{margin:14px 0 8px;font-size:15px;font-weight:600;color:#a9d8ff;letter-spacing:.02em}

#hud>*{position:absolute}
#tl{top:14px;left:16px;min-width:220px}#tl .sys{font-size:20px;font-weight:700}#tl .lv{color:var(--mut)}#tl .sp{color:var(--gold)}#tl .cr{color:var(--gold);font-weight:600}
.xpbar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin:4px 0;width:220px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#4dd6ff,#b766ff);border-radius:2px}
#toasts{top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(640px,90vw)}

/* guide + about */
.guide{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;height:100%;padding-top:12px}
.gnav{display:flex;flex-direction:column;gap:2px;overflow:auto}.gnav button{text-align:left;border-color:transparent;background:transparent;min-height:36px}.gnav button.on{background:rgba(77,214,255,.16);border-color:rgba(77,214,255,.45)}
.gbody{overflow:auto;max-width:780px;padding-right:6px;font-size:15px;line-height:1.6}.gbody h2{margin:0 0 10px;font-size:24px}.gbody h4{margin:14px 0 6px;color:#a9d8ff;font-size:14px}.gbody p,.gbody li{color:#cfdff0}.gbody ul.cols{columns:2;column-gap:24px}.gbody ul.cols li{break-inside:avoid;margin-bottom:4px;font-size:14px}
.gbody .steps li{margin-bottom:6px}.gbody .tbl{margin:8px 0 12px}.gbody .sw{width:12px;height:12px;vertical-align:-1px}
kbd{font:600 12px "Chakra Petch",monospace;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-bottom-width:2px;border-radius:4px;padding:0 5px;white-space:nowrap}
a{color:var(--acc)}
.about .ab-logo{font-size:40px;font-weight:700;letter-spacing:.16em;color:#e8f7ff;text-shadow:0 0 24px rgba(77,214,255,.5)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:10px 0 14px}.links a{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(77,214,255,.05);text-decoration:none;color:var(--ink);pointer-events:auto}.links a:hover{background:rgba(77,214,255,.14)}.links a b{color:var(--acc)}
.credit{margin-top:14px;font-size:13px;color:#8fa7c4;pointer-events:auto}.credit a{color:#bfe8ff}
@media(max-width:760px){.guide{grid-template-columns:minmax(0,1fr)}.gnav{flex-direction:row;overflow-x:auto}.gnav button{flex:none}.gbody ul.cols{columns:1}}
@media(prefers-reduced-motion:reduce){.toast,#warp{transition:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script src="game.js"></script>
</body>
